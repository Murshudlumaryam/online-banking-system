server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets are content-hashed by Vite, so they're safe to cache
    # aggressively; index.html itself must always be revalidated so a new
    # deploy is picked up immediately instead of being served stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing — any path that isn't a real file
    # falls back to index.html so /app/dashboard etc. work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
