name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    name: Backend / Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check backend/app backend/alembic backend/tests --select E,F,I --ignore E501

  backend-typecheck:
    name: Backend / Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt mypy
        working-directory: .
      - run: mypy app
        working-directory: backend

  backend-security-scan:
    name: Backend / Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      # Audited in an isolated venv so the report reflects exactly what
      # ships (backend/requirements.txt), not the runner's own tooling.
      - run: |
          python -m venv /tmp/audit-venv
          /tmp/audit-venv/bin/pip install --quiet -r backend/requirements.txt
          /tmp/audit-venv/bin/pip install --quiet pip-audit
          /tmp/audit-venv/bin/python -m pip_audit
        # Non-blocking for now: the one known finding (ecdsa / Minerva timing
        # attack) is a documented, accepted risk — see backend/README.md.
        # Flip this to a hard failure once that's re-evaluated or resolved.
        continue-on-error: true

  backend-test:
    name: Backend / Tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: banking_user
          POSTGRES_PASSWORD: banking_pass
          POSTGRES_DB: banking_test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U banking_user -d banking_test_db"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://banking_user:banking_pass@localhost:5432/banking_test_db
      DATABASE_URL: postgresql+asyncpg://banking_user:banking_pass@localhost:5432/banking_db
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
      ENCRYPTION_KEY: qZ_JcB_hV7g9K00Ho6v5MGXR9Eu6JmfKYy1pxOOq8A4=
      RATE_LIMIT_BACKEND: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Run Alembic migrations against a scratch database
        run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://banking_user:banking_pass@localhost:5432/banking_test_db
      - name: Run pytest with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml -v
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend-lint:
    name: Frontend / Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  frontend-typecheck-and-build:
    name: Frontend / Type-check + build (tsc, vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  frontend-test:
    name: Frontend / Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  frontend-audit:
    name: Frontend / Dependency audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
        working-directory: frontend
      # Known findings are dev-server-only (esbuild/vite dev server) and do
      # not affect the production build — see frontend/README.md. Non-blocking
      # until re-evaluated.
      - run: npm audit --audit-level=critical
        working-directory: frontend
        continue-on-error: true

  e2e-tests:
    name: E2E / Playwright (real browser, real backend, real DB)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: banking_user
          POSTGRES_PASSWORD: banking_pass
          POSTGRES_DB: banking_e2e_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U banking_user -d banking_e2e_db"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql+asyncpg://banking_user:banking_pass@localhost:5432/banking_e2e_db
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-e2e-secret-key-not-for-production
      ENCRYPTION_KEY: qZ_JcB_hV7g9K00Ho6v5MGXR9Eu6JmfKYy1pxOOq8A4=
      RATE_LIMIT_BACKEND: memory
      # The magic flag: enables the debug-* test-only endpoints these specs
      # rely on (see frontend/e2e/README.md). Never set this in a real
      # deployment — every debug-* route 404s unless this is exactly "test".
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Apply migrations
        run: alembic upgrade head
        working-directory: backend
      - name: Start backend (background)
        run: nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
        working-directory: backend
      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "Backend never became healthy"; cat backend/backend.log; exit 1

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run Playwright tests
        run: npm run test:e2e
        working-directory: frontend
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  docker-build:
    name: Docker / Build backend + frontend images
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: online-banking-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: online-banking-frontend:ci
