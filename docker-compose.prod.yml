# Production stack. Differences from docker-compose.yml (dev):
#   - backend/frontend built from Dockerfile.prod (gunicorn workers / nginx
#     static serving), not the dev hot-reload images
#   - Postgres and Redis are NOT published to the host at all — only
#     reachable by other containers on banking_network
#   - Caddy is the only container exposed to the internet (80/443); it
#     terminates TLS and reverse-proxies to backend/frontend
#   - restart: unless-stopped everywhere so the stack survives a VM reboot
#
# Usage: see DEPLOYMENT.md. Bring the whole stack up with:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    container_name: banking_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-banking_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-banking_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - banking_network

  redis:
    image: redis:7-alpine
    container_name: banking_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - banking_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: online-banking-backend:latest
    container_name: banking_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-banking_db}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      RATE_LIMIT_BACKEND: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - banking_network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: online-banking-backend:latest
    container_name: banking_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-banking_db}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: celery -A app.background_tasks.celery_app worker --loglevel=info --concurrency=2 -Q celery,audit_queue,notification_queue,default_queue
    networks:
      - banking_network

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: online-banking-backend:latest
    container_name: banking_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-banking_db}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: celery -A app.background_tasks.celery_app beat --loglevel=info
    networks:
      - banking_network

  # Runs automatically before backend/celery start — no more manual
  # `docker compose run --rm migrate` step to forget. `alembic upgrade
  # head` is idempotent, so this is safe to run on every `up` including
  # restarts where the schema is already current.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: online-banking-backend:latest
    container_name: banking_migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-banking_db}
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    networks:
      - banking_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: online-banking-frontend:latest
    container_name: banking_frontend
    restart: unless-stopped
    networks:
      - banking_network

  caddy:
    image: caddy:2-alpine
    container_name: banking_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - banking_network

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  banking_network:
    driver: bridge
