[mypy]
python_version = 3.12
plugins = pydantic.mypy

warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True

# The codebase is written with modern type hints throughout, but SQLAlchemy's
# declarative/relationship patterns and a few third-party stubs (celery,
# jose) don't fully satisfy strict mode without extensive per-module
# ignores — tightening further is a good candidate for a follow-up pass.
disallow_untyped_defs = False

exclude = ^(alembic/|tests/)

[mypy-celery.*]
ignore_missing_imports = True

[mypy-jose.*]
ignore_missing_imports = True

[mypy-argon2.*]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-pyotp.*]
ignore_missing_imports = True

[mypy-aiosmtplib.*]
ignore_missing_imports = True

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
